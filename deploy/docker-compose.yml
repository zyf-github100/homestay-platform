services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: homestay
      MYSQL_USER: homestay
      MYSQL_PASSWORD: homestay
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    command: redis-server --appendonly yes
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/homestay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: homestay
      DB_PASSWORD: homestay
      REDIS_HOST: redis
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  mysql_data:
  redis_data:
