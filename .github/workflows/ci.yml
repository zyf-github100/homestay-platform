name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        env:
          APP_ENV: test
          DB_URL: jdbc:mysql://127.0.0.1:3306/homestay
          DB_USERNAME: homestay
          DB_PASSWORD: ci-db-password
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ci-redis-password
          GUEST_ID_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: mvn -B -f backend/pom.xml test

  user-build:
    name: User frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-user/package-lock.json
      - run: npm ci --prefix web-user
      - run: npm run build --prefix web-user

  admin-build:
    name: Admin frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --prefix web-admin
      - run: npm run build --prefix web-admin

  integration:
    name: Compose API smoke and Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-test, user-build, admin-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate ephemeral CI environment
        shell: bash
        run: |
          set -euo pipefail
          cat > ci.env <<EOF
          APP_ENV=ci
          APP_PORT=8088
          DB_NAME=homestay
          DB_USERNAME=homestay
          DB_PASSWORD=$(openssl rand -hex 24)
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          GUEST_ID_ENCRYPTION_KEY=$(openssl rand -hex 16)
          SEED_ADMIN_ENABLED=true
          ADMIN_INITIAL_USERNAME=admin
          ADMIN_INITIAL_PASSWORD=ci-admin-$(openssl rand -hex 16)
          EOF
          set -a
          . ./ci.env
          set +a
          {
            echo "E2E_ADMIN_USERNAME=$ADMIN_INITIAL_USERNAME"
            echo "E2E_ADMIN_PASSWORD=$ADMIN_INITIAL_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Start Compose stack and wait for health
        run: docker compose --env-file ci.env -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Run API smoke
        env:
          API_BASE_URL: http://127.0.0.1:8088/api/v1
        run: node tests/api-smoke.mjs
      - name: Run operations smoke
        env:
          API_BASE_URL: http://127.0.0.1:8088/api/v1
        run: node tests/operations-smoke.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run Playwright E2E
        env:
          API_BASE_URL: http://127.0.0.1:8088/api/v1
          USER_WEB_URL: http://127.0.0.1:8088/
          ADMIN_WEB_URL: http://127.0.0.1:8088/admin/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.js
        run: node tests/e2e.mjs
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file ci.env -f deploy/docker-compose.yml logs --no-color
      - name: Tear down Compose stack
        if: always()
        run: docker compose --env-file ci.env -f deploy/docker-compose.yml down -v
