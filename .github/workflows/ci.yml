name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Maven tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        env:
          APP_ENV: test
          DB_URL: jdbc:mysql://127.0.0.1:3306/homestay
          DB_USERNAME: homestay
          DB_PASSWORD: ci-db-password
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: ci-redis-password
          GUEST_ID_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
        run: mvn -B -f backend/pom.xml test

  user-build:
    name: User frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-user/package-lock.json
      - run: npm ci --prefix web-user
      - run: npm run build --prefix web-user

  admin-build:
    name: Admin frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci --prefix web-admin
      - run: npm run build --prefix web-admin

  integration:
    name: Compose API smoke and Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-test, user-build, admin-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate ephemeral CI environment
        shell: bash
        run: |
          set -euo pipefail
          # BuildKit refuses to read a build secret from /dev/null, so hand it a real empty file.
          : > ci-proxy-ca.crt
          cat > ci.env <<EOF
          APP_ENV=ci
          APP_PORT=8088
          CODEX_PROXY_CERT=$PWD/ci-proxy-ca.crt
          DB_NAME=homestay
          DB_USERNAME=homestay
          DB_PASSWORD=$(openssl rand -hex 24)
          MYSQL_ROOT_PASSWORD=$(openssl rand -hex 24)
          REDIS_PASSWORD=$(openssl rand -hex 24)
          GUEST_ID_ENCRYPTION_KEY=$(openssl rand -hex 16)
          SEED_ADMIN_ENABLED=true
          ADMIN_INITIAL_USERNAME=admin
          ADMIN_INITIAL_PASSWORD=ci-admin-$(openssl rand -hex 16)
          EOF
          set -a
          . ./ci.env
          set +a
          {
            echo "E2E_ADMIN_USERNAME=$ADMIN_INITIAL_USERNAME"
            echo "E2E_ADMIN_PASSWORD=$ADMIN_INITIAL_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Start Compose stack and wait for health
        run: docker compose --env-file ci.env -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Run API smoke
        env:
          API_BASE_URL: http://127.0.0.1:8088/api/v1
        run: node tests/api-smoke.mjs
      - name: Run operations smoke
        env:
          API_BASE_URL: http://127.0.0.1:8088/api/v1
        run: node tests/operations-smoke.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" playwright
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run Playwright E2E
        env:
          API_BASE_URL: http://127.0.0.1:8088/api/v1
          USER_WEB_URL: http://127.0.0.1:8088/
          ADMIN_WEB_URL: http://127.0.0.1:8088/admin/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/playwright/node_modules/playwright/index.js
        run: node tests/e2e.mjs
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file ci.env -f deploy/docker-compose.yml logs --no-color
      - name: Tear down Compose stack
        if: always()
        run: docker compose --env-file ci.env -f deploy/docker-compose.yml down -v

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Trigger redeploy on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=20 \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
      - name: Verify production health and routing
        run: |
          base="http://${{ secrets.DEPLOY_HOST }}:8090"
          body=""
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "$base/health" || true)
            printf 'attempt %s: %s\n' "$i" "$body"
            if printf '%s' "$body" | grep -q '"status":"ok"' && printf '%s' "$body" | grep -q '"redis":"ok"' && printf '%s' "$body" | grep -q '"database":"ok"'; then break; fi
            sleep 10
          done
          printf '%s' "$body" | grep -q '"status":"ok"' || { echo "::error::backend health check failed"; exit 1; }
          printf '%s' "$body" | grep -q '"redis":"ok"' || { echo "::error::redis health check failed"; exit 1; }
          printf '%s' "$body" | grep -q '"database":"ok"' || { echo "::error::database health check failed"; exit 1; }
          # nginx caches upstream IPs; catch the user/admin-web routing swap before it ships.
          curl -fsS --max-time 10 "$base/" | grep -q 'src="/assets/' \
            || { echo "::error::user web is not served at /"; exit 1; }
          curl -fsS --max-time 10 "$base/admin/" | grep -q 'src="/admin/assets/' \
            || { echo "::error::admin web is not served at /admin/"; exit 1; }
          # Same-origin POSTs carry an Origin header; if nginx forwards a port-less Host
          # the backend treats them as cross-origin and answers 403. Probe with bad creds:
          # 401 means the request reached the app, 403 means CORS rejected it.
          login_code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST "$base/api/v1/auth/login" \
            -H 'Content-Type: application/json' -H "Origin: $base" \
            -d '{"username":"__deploy_probe__","password":"__deploy_probe__"}')
          echo "browser login probe: $login_code"
          [ "$login_code" = "401" ] || { echo "::error::browser login rejected (CORS/Host header), got $login_code"; exit 1; }
          echo "production health and routing ok"
