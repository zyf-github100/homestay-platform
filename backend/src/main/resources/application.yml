spring:
  application:
    name: homestay-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/homestay?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:homestay}
    password: ${DB_PASSWORD:homestay}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${SERVER_PORT:8080}
guest:
  id-encryption-key: ${GUEST_ID_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
